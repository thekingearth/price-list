<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
    }

    #status {
      margin-bottom: 10px;
    }

    .table-container {
      width: 100%;
      max-height: 85vh;
      overflow: auto;
    }

    table {
      border-collapse: collapse;
      white-space: nowrap;
    }

    td {
      border: 1px solid #ccc;
      padding: 6px 10px;
    }

    tr:nth-child(even) {
      background: #f2f2f2;
    }
  </style>
</head>

<body>

  <div id="status">Memuat data...</div>

  <div class="table-container">
    <table id="tabelData"></table>
  </div>

  <script>
    function tampilkanData(data) {
      const tabel = document.getElementById('tabelData');
      const fragment = document.createDocumentFragment();

      data.forEach(function(baris) {
        const tr = document.createElement('tr');

        baris.forEach(function(nilai) {
          const td = document.createElement('td');

          // Menampilkan nilai, bukan rumus spreadsheet
          td.textContent = nilai;

          tr.appendChild(td);
        });

        fragment.appendChild(tr);
      });

      tabel.replaceChildren(fragment);

      document.getElementById('status').textContent =
        'Data berhasil dimuat: ' +
        data.length + ' baris × ' +
        (data[0] ? data[0].length : 0) + ' kolom';
    }

    function muatData() {
      google.script.run
        .withSuccessHandler(tampilkanData)
        .withFailureHandler(function(error) {
          document.getElementById('status').textContent =
            'Gagal memuat data: ' + error.message;
        })
        .getData();
    }

    muatData();

    // Memperbarui data setiap 30 detik
    setInterval(muatData, 30000);
  </script>

</body>
</html>
